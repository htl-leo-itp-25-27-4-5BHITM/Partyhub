<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1a1040">
  <title>Opening registration - PartyHub</title>
  <link rel="stylesheet" href="/global.css">
  <link rel="stylesheet" href="/auth/flow.css">
  <script src="/auth-service.js" defer></script>
  <script src="/auth/flow.js" defer></script>
</head>
<body data-auth-action="register">
  <main class="auth-flow">
    <h1>Opening registration</h1>
    <p id="status" role="status">Please wait…</p>
    <div class="auth-flow-actions">
      <button id="retry" type="button" hidden>Try again</button>
      <a href="/index.html">Return home</a>
    </div>
    <noscript>Enable JavaScript to continue.</noscript>
  </main>
</body>
</html>
