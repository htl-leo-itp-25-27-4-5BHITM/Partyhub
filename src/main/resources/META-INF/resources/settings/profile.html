<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="/theme-boot.js?v=20261125-settings"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit profile - PartyHub</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1a1040" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PartyHub" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="icon" href="/icons/icon-192.png" sizes="192x192" type="image/png" />
    <link rel="stylesheet" href="../global.css">
    <link rel="stylesheet" href="../index.css">
    <script src="../auth-service.js?v=20261125-settings" defer></script>
    <script src="../route-guard.js" defer></script>
    <script src="../nav.js?v=20261125-settings" defer></script>
    <script src="./settings-common.js?v=20261125-settings" defer></script>
    <script src="./profile.js?v=20261125-settings" defer></script>
    <link rel="stylesheet" href="/design-system.css?v=20261125-light-palette" />
    <link rel="stylesheet" href="/theme-light.css?v=20261125-light-palette" />
    <link rel="stylesheet" href="./settings.css?v=20261125-settings">
</head>
<body class="settings-page" data-auth-required>
    <div class="app-shell">
      <main class="settings-main">
        <header class="settings-header">
          <a class="icon-button" href="index.html" data-back aria-label="Back">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </a>
          <h1>Edit profile</h1>
          <span aria-hidden="true"></span>
        </header>

        <form id="profileForm" class="settings-form" novalidate>
          <section class="settings-section">
            <h2>Profile picture</h2>
            <div class="settings-card padded picture-row">
              <img id="pictureImg" alt="Your profile picture" width="84" height="84">
              <div class="settings-actions">
                <label class="settings-btn" for="pictureInput">Change picture</label>
                <input type="file" id="pictureInput" accept="image/jpeg,image/png,image/gif,image/webp" class="visually-hidden">
                <button type="button" class="settings-btn danger" id="pictureRemove">Remove</button>
              </div>
            </div>
          </section>
          <section class="settings-section">
            <h2>Personal information</h2>
            <div class="settings-card padded settings-form">
              <div class="form-group">
                <label for="displayName">Display name</label>
                <input type="text" id="displayName" maxlength="80" autocomplete="name" aria-describedby="displayName-error">
                <p class="field-error" id="displayName-error" role="alert"></p>
              </div>
              <div class="form-group">
                <label for="distinctName">Username</label>
                <input type="text" id="distinctName" maxlength="30" autocomplete="username" aria-describedby="distinctName-hint distinctName-error">
                <p class="field-hint" id="distinctName-hint">3–30 characters: letters, digits, dots and underscores.</p>
                <p class="field-error" id="distinctName-error" role="alert"></p>
              </div>
              <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" readonly aria-describedby="email-hint">
                <p class="field-hint" id="email-hint"><a class="text-link" href="email.html">Change e-mail address</a></p>
              </div>
              <div class="form-group">
                <label for="phoneNumber">Phone number <span class="field-hint">(optional)</span></label>
                <input type="tel" id="phoneNumber" maxlength="30" autocomplete="tel">
              </div>
              <div class="form-group">
                <label for="biography">Biography</label>
                <textarea id="biography" rows="4" maxlength="300" aria-describedby="biography-error"></textarea>
                <p class="field-error" id="biography-error" role="alert"></p>
              </div>
            </div>
          </section>
          <section class="settings-section">
            <h2>About you <span class="field-hint">(optional)</span></h2>
            <div class="settings-card padded settings-form">
              <p class="field-hint">Only you can see these. Hosts only see anonymous percentages once at least 5 guests shared them.</p>
              <div class="form-group">
                <label for="gender">Gender</label>
                <select id="gender">
                  <option value="">Not set</option>
                  <option value="FEMALE">Female</option>
                  <option value="MALE">Male</option>
                  <option value="DIVERSE">Diverse</option>
                  <option value="NOT_SPECIFIED">Prefer not to say</option>
                </select>
              </div>
              <div class="form-group">
                <label for="birthDate">Date of birth</label>
                <input type="date" id="birthDate" aria-describedby="birthDate-error">
                <p class="field-error" id="birthDate-error" role="alert"></p>
              </div>
            </div>
          </section>
          <p class="status-box" id="formStatus" role="status" hidden></p>
          <div class="settings-actions">
            <button type="submit" class="settings-btn primary" id="saveBtn" disabled>Save changes</button>
          </div>
        </form>
      </main>
      <nav class="bottom-nav" role="navigation" aria-label="Bottom navigation">
        <a class="nav-btn" href="/index.html" aria-label="Home">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M3 6.5L8 4l7 2.5 6-2.5v11l-6 2.5L10 15 3 17.5v-11z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
          </svg>
          <span class="nav-label">Home</span>
        </a>

        <a class="nav-btn" href="/listPartys/listPartys.html" aria-label="Parties">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="3" y="3" width="18" height="18" rx="3" stroke="currentColor" stroke-width="1.6"/>
            <circle cx="8.5" cy="8.5" r="1.8" fill="currentColor" />
            <path d="M21 21l-6-6-5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span class="nav-label">Parties</span>
        </a>

        <a class="nav-btn" href="/notifications/notifications.html" aria-label="Inbox">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 22a2.5 2.5 0 0 0 2.45-2H9.55A2.5 2.5 0 0 0 12 22z" fill="currentColor"/>
            <path d="M18 8a6 6 0 10-12 0v5l-2 2v1h16v-1l-2-2V8z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span class="nav-label">Inbox</span>
        </a>

        <a class="nav-btn active" href="/profile/profile.html" aria-label="Profile" aria-current="page">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="12" cy="8.5" r="3" stroke="currentColor" stroke-width="1.6"/>
            <path d="M4 20a8 8 0 0 1 16 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span class="nav-label">Profile</span>
        </a>
      </nav>
    </div>
</body>
</html>
