<body class="settings-page">
    <div class="app-shell">
      <main class="settings-main">
        <header class="settings-header">
          <a class="icon-button" href="/index.html" data-back aria-label="PartyHub home">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>

          <div class="settings-card padded">
            <p class="status-box" id="confirmStatus" role="status">Checking your link…</p>

              <a class="settings-btn" href="/settings/email.html" id="newLinkBtn">Request a new link</a>

          </div>

      </main>
