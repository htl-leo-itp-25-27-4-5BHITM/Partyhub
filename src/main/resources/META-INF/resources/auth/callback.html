<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Signing in - PartyHub</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1a1040" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PartyHub" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="icon" href="/icons/icon-192.png" sizes="192x192" type="image/png" />
    <link rel="stylesheet" href="../global.css" />
    <link rel="stylesheet" href="/auth/flow.css" />
    <script src="../auth-service.js" defer></script>
  </head>
  <body>
    <main class="auth-flow">
      <h1>Signing in</h1>
      <p id="status" role="status">Completing sign-in...</p>
      <div class="auth-flow-actions" id="recovery" hidden>
        <a href="/register_login/login/login.html">Try again</a>
        <a href="/index.html">Return home</a>
      </div>
    </main>
    <script>
      window.addEventListener("DOMContentLoaded", async () => {
        try {
          await window.authService.handleCallback();
        } catch (error) {
          console.error(error);
          document.getElementById("status").textContent =
            "We couldn’t complete sign-in. Please try again or return home.";
          document.getElementById("recovery").hidden = false;
        }
      });
    </script>
  <!-- impeccable-live-start -->
<script src="http://localhost:8400/live.js?token=d72ea5ca-fe6f-4474-b90c-bcc3506b3754"></script>
<!-- impeccable-live-end -->
</body>
</html>
