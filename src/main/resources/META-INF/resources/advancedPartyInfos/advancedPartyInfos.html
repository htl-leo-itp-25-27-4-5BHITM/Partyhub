<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Party Info</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1a1040" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PartyHub" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="icon" href="/icons/icon-192.png" sizes="192x192" type="image/png" />

    <link href="../global.css" rel="stylesheet" />
    <link href="../index.css" rel="stylesheet" />
    <link href="./advancedPartyInfos.css?v=20261021-bring-along" rel="stylesheet" />

    <script src="../user-utils.js" defer></script>
    <script src="../auth-service.js" defer></script>
    <script src="../nav.js?v=20261016-design" defer></script>
    <script src="../backend-functions.js?v=20260429-fresh-db" defer></script>
    <script src="./advancedPartyInfos.js?v=20261021-bring-along" defer></script>
    <script src="./bringAlong.js?v=20261021-bring-along" defer></script>
    <link rel="stylesheet" href="/design-system.css?v=20261019-favorite-actions" />
</head>

  <body class="bg-light">
    <div class="app-shell">
      <div class="container py-4">
        <main class="party-info-root">
          <section class="party-card">
            <header class="card-header">
              <button class="back-btn" aria-label="Back">‹</button>
              <h1 class="party-title">Loading party...</h1>

            </header>

            <div class="meta-row">
              <span class="meta-chip" id="media-count"></span>
              <span class="meta-chip" id="location-display"></span>
              <span class="meta-chip" id="party-date"></span>
              <span class="meta-chip visibility-chip" id="visibility-display" aria-label="Party visibility"></span>
            </div>

            <p class="description" id="party-description"></p>

            <a
              class="website"
              id="party-website"
              href="#"
              target="_blank"
              rel="noopener"
              style="display: none;"
            ></a>

            <section class="details-card">
              <div class="details-grid">
                <div class="info-item">
                  <span class="label">Theme</span>
                  <span class="value" id="party-category"></span>
                </div>
                <div class="info-item">
                  <span class="label">When</span>
                  <span class="value" id="party-time"></span>
                </div>
                <div class="info-item">
                  <span class="label">Age restriction</span>
                  <span class="value" id="age-restriction"></span>
                </div>
                <div class="info-item">
                  <span class="label">Max attendees</span>
                  <span class="value" id="max-attendees"></span>
                </div>
              </div>
            </section>

            <div class="action-group">
              <div class="party-primary-actions">
              <button class="join-party-btn" id="joinPartyBtn" style="display: none;">
                <span class="btn-text">Join Party</span>
                <span class="btn-icon">
                  <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
                    <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" fill="currentColor"/>
                  </svg>
                </span>
              </button>
              <button class="favorite-toggle" id="favoritePartyBtn" type="button" aria-label="Add to favorites" title="Add to favorites" aria-pressed="false" disabled>
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" /></svg>
              </button>
              </div>

              <p id="favoriteFeedback" class="favorite-feedback" role="status" aria-live="polite"></p>

              <button class="secondary-btn photos-btn">
                <span>View Gallery</span>
                <span class="arrow">
                  <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
                    <path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                  </svg>
                </span>
              </button>
            </div>

            <section class="details-card bring-along" id="bring-along-section" aria-labelledby="bring-along-title">
              <header class="ba-header">
                <h2 class="ba-title" id="bring-along-title">Bring-along list</h2>
                <span class="ba-live" id="bring-along-live" role="status" aria-live="polite" hidden></span>
              </header>
              <p class="ba-hint" id="bring-along-hint">Loading…</p>
              <ul class="ba-list" id="bring-along-list" aria-live="polite"></ul>
              <form class="ba-add" id="bring-along-add" novalidate hidden>
                <input class="ba-input" name="name" type="text" maxlength="100" placeholder="e.g. Chips" aria-label="Item" required />
                <input class="ba-input ba-input-qty" name="quantity" type="number" min="1" max="10000" step="1" inputmode="numeric" value="1" aria-label="Quantity" required />
                <input class="ba-input ba-input-unit" name="unit" type="text" maxlength="30" placeholder="Unit" aria-label="Unit (optional)" />
                <button class="ba-btn ba-btn-primary" type="submit">Add</button>
                <p class="ba-error" id="bring-along-add-error" role="alert"></p>
              </form>
            </section>

            <section class="invited-section">
              <button class="secondary-btn invited-toggle">
                <span>Members</span>
                <span class="arrow">
                  <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
                    <path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                  </svg>
                </span>
              </button>

              <ul class="invited-list" aria-hidden="true">
                <li class="invited-empty">Loading members...</li>
              </ul>
            </section>
          </section>
        </main>
      </div>

      <nav class="bottom-nav" role="navigation" aria-label="Bottom navigation">
        <a class="nav-btn" href="/index.html" aria-label="Home">
          <svg class="nav-icon icon--pink" width="28" height="28" viewBox="0 0 24 24" fill="none"><path d="M3 6.5L8 4l7 2.5 6-2.5v11l-6 2.5L10 15 3 17.5v-11z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/></svg>
        </a>
        <a class="nav-btn" href="/listPartys/listPartys.html" aria-label="List Parties">
          <svg class="nav-icon icon--pink" width="28" height="28" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="18" height="18" rx="3" stroke="currentColor" stroke-width="1.2"/><circle cx="8.5" cy="8.5" r="1.8" fill="currentColor"/><path d="M21 21l-6-6-5 5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </a>
        <a class="nav-btn" href="/notifications/notifications.html" aria-label="Notifications">
          <svg class="nav-icon icon--pink" width="28" height="28" viewBox="0 0 24 24" fill="none"><path d="M12 22a2.5 2.5 0 0 0 2.45-2H9.55A2.5 2.5 0 0 0 12 22z" fill="currentColor"/><path d="M18 8a6 6 0 10-12 0v5l-2 2v1h16v-1l-2-2V8z" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </a>
        <a class="nav-btn" href="/profile/profile.html" aria-label="Profile">
          <svg class="nav-icon icon--pink" width="28" height="28" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8.5" r="3" stroke="currentColor" stroke-width="1.2"/><path d="M4 20a8 8 0 0 1 16 0" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </a>
      </nav>
    </div>
  </body>
</html>
