<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Dashboard</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1a1040" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PartyHub" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="icon" href="/icons/icon-192.png" sizes="192x192" type="image/png" />

    <link rel="stylesheet" href="../global.css" />
    <link rel="stylesheet" href="../index.css" />
    <link rel="stylesheet" href="/design-system.css?v=20261016-1" />
    <link rel="stylesheet" href="./dashboard.css?v=20261123-1" />

    <script src="../user-utils.js" defer></script>
    <script src="../auth-service.js" defer></script>
    <script src="../route-guard.js" defer></script>
    <script src="../nav.js?v=20261118-badge-fast" defer></script>
    <script src="./dashboard.js?v=20261123-1" defer></script>
  </head>

  <body class="bg-light" data-auth-required>
    <div class="app-shell">
      <main class="container py-4 dash">
        <header class="page-header">
          <a class="dash-back" href="/profile/profile.html" aria-label="Back to profile">&larr; Profile</a>
          <h1 class="page-title font-heading">Dashboard</h1>
          <p class="page-subtitle font-body-text">How your parties and your profile are doing</p>
        </header>

        <div class="dash-controls">
          <div class="dash-range" role="radiogroup" aria-label="Time range">
            <button type="button" role="radio" data-range="7d" aria-checked="false">7 days</button>
            <button type="button" role="radio" data-range="30d" aria-checked="true">30 days</button>
            <button type="button" role="radio" data-range="3m" aria-checked="false">3 months</button>
            <button type="button" role="radio" data-range="6m" aria-checked="false">6 months</button>
          </div>
        </div>

        <p class="dash-status" id="dashStatus" role="status" aria-live="polite"></p>

        <section class="dash-tiles" id="dashTiles" aria-label="Key figures"></section>

        <section class="dash-card" aria-labelledby="chartTitle">
          <div class="dash-card-head">
            <label class="dash-metric-label" for="metricSelect">Show</label>
            <select id="metricSelect" class="dash-select">
              <option value="timeline">Followers &amp; joins over time</option>
              <option value="visibility">Private vs. public</option>
              <option value="invitations">Invitation responses</option>
              <option value="capacity">Capacity per party</option>
              <option value="gender">Guests by gender</option>
              <option value="age">Guests by age</option>
            </select>
          </div>
          <h2 class="dash-chart-title" id="chartTitle"></h2>
          <p class="dash-chart-sub" id="chartSub"></p>
          <div class="dash-legend" id="chartLegend"></div>
          <div class="dash-chart" id="chart"></div>
          <div class="dash-tooltip" id="chartTooltip" role="tooltip" hidden></div>
          <details class="dash-table-wrap">
            <summary>Show as table</summary>
            <div id="chartTable"></div>
          </details>
        </section>

        <p class="dash-note">
          Followers and joins are counted from the moment this dashboard went live.
          Gender and age are only shown as percentages once at least 5 guests shared them.
        </p>
      </main>

      <nav class="bottom-nav" role="navigation" aria-label="Bottom navigation">
        <a class="nav-btn" href="/index.html" aria-label="Home">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M3 6.5L8 4l7 2.5 6-2.5v11l-6 2.5L10 15 3 17.5v-11z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" />
          </svg>
          <span class="nav-label">Home</span>
        </a>
        <a class="nav-btn" href="/listPartys/listPartys.html" aria-label="Parties">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="3" y="3" width="18" height="18" rx="3" stroke="currentColor" stroke-width="1.6" />
            <circle cx="8.5" cy="8.5" r="1.8" fill="currentColor" />
            <path d="M21 21l-6-6-5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <span class="nav-label">Parties</span>
        </a>
        <a class="nav-btn" href="/notifications/notifications.html" aria-label="Inbox">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 22a2.5 2.5 0 0 0 2.45-2H9.55A2.5 2.5 0 0 0 12 22z" fill="currentColor" />
            <path d="M18 8a6 6 0 10-12 0v5l-2 2v1h16v-1l-2-2V8z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <span class="nav-label">Inbox</span>
        </a>
        <a class="nav-btn" href="/profile/profile.html" aria-label="Profile">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="12" cy="8.5" r="3" stroke="currentColor" stroke-width="1.6" />
            <path d="M4 20a8 8 0 0 1 16 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <span class="nav-label">Profile</span>
        </a>
      </nav>
    </div>
  </body>
</html>
