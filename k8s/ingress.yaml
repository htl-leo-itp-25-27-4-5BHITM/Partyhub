apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: partyhub-ingress
  annotations:
    # nginx defaults to 1m, which rejects normal phone photos; gallery uploads allow 5 MiB per file
    nginx.ingress.kubernetes.io/proxy-body-size: "8m"
spec:
  ingressClassName: nginx
  rules:
  - host: it220274.cloud.htl-leonding.ac.at
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: quarkus
            port:
              number: 8080
      - path: /keycloak
        pathType: Prefix
        backend:
          service:
            name: keycloak
            port:
              # Match the Service port (8180), not its container targetPort (8080).
              number: 8180
