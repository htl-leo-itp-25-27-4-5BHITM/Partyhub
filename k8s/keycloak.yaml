apiVersion: v1
kind: Service
metadata:
  name: keycloak
spec:
  type: ClusterIP
  ports:
  - port: 8180
    targetPort: 8080
  selector:
    app: keycloak
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
      - name: keycloak
        image: ghcr.io/htl-leo-itp-25-27-4-5bhitm/partyhub-keycloak:latest
        imagePullPolicy: Always
        args:
        - start
        - --import-realm
        env:
        - name: KC_BOOTSTRAP_ADMIN_USERNAME
          valueFrom:
            secretKeyRef:
              name: keycloak-database-secret
              key: admin-username
        - name: KC_BOOTSTRAP_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: keycloak-database-secret
              key: admin-password
        - name: KC_PROXY_HEADERS
          value: xforwarded
        - name: KC_HTTP_ENABLED
          value: 'true'
        - name: KC_HOSTNAME
          value: https://it220274.cloud.htl-leonding.ac.at/keycloak
        - name: KC_HTTP_RELATIVE_PATH
          value: /keycloak
        - name: KC_HEALTH_ENABLED
          value: 'true'
        - name: KC_DB_URL_DATABASE
          value: keycloak
        - name: KC_DB_URL_HOST
          value: keycloak-db
        - name: KC_DB
          value: postgres
        - name: KC_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: keycloak-database-secret
              key: password
        - name: KC_DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: keycloak-database-secret
              key: username
        - name: KC_SPI_THEME_DEFAULT
          value: partyhub
        - name: KC_METRICS_ENABLED
          value: 'true'
        - name: KC_HTTP_MANAGEMENT_RELATIVE_PATH
          value: /
        envFrom:
        - secretRef:
            name: partyhub-smtp-secret
        ports:
        - name: http
          containerPort: 8080
        - name: management
          containerPort: 9000
        resources:
          limits:
            cpu: 2000m
            memory: 2000Mi
          requests:
            cpu: 500m
            memory: 1700Mi
        startupProbe:
          httpGet:
            path: /health/started
            port: management
          periodSeconds: 10
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /health/ready
            port: management
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health/live
            port: management
          periodSeconds: 10
          failureThreshold: 3
