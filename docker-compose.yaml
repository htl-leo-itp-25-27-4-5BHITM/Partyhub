services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: demo
      POSTGRES_USER: demo
      POSTGRES_DB: demo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d demo"]
      interval: 5s
      timeout: 5s
      retries: 30

  keycloak-db:
    image: postgres:16-alpine
    volumes:
      - keycloak-db:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak-local}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 30

  keycloak:
    build:
      context: .
      dockerfile: Dockerfile.keycloak
      target: theme
    command: ["start-dev", "--import-realm"]
    ports:
      - "127.0.0.1:8000:8080"
    volumes:
      - ./keycloak/realm-dev.json:/opt/keycloak/data/import/partyhub-realm.json:ro
      - ./keycloak/themes/partyhub:/opt/keycloak/themes/partyhub:ro
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-db
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak-local}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_SPI_THEME_DEFAULT: partyhub
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - "{ printf 'HEAD /health/ready HTTP/1.0\r\n\r\n' >&0; grep 'HTTP/1.0 200'; } 0<>/dev/tcp/localhost/9000"
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 60
    depends_on:
      keycloak-db:
        condition: service_healthy

volumes:
  postgres:
  keycloak-db:
