# https://coresynapseai.com/2025/08/09/automating-kubernetes-deployments-with-github-actions/
# Incremental deploy: updates the running environment in place and keeps all data.
# Called by the deploy job in push.yaml after a successful build, or run manually.
name: Deploy
on:
  workflow_call:
    inputs:
      image-tag:
        description: 'Image tag to deploy (short commit SHA)'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      image-tag:
        description: 'Image tag to deploy (short commit SHA)'
        required: true
        type: string
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      IMAGE_TAG: ${{ inputs.image-tag }}
      REGISTRY_PREFIX: ghcr.io/htl-leo-itp-25-27-4-5bhitm
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: Configure Kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_DATA }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Apply manifests
        run: |
          echo "Applying Kubernetes manifests"
          kubectl apply -f k8s/postgres.yaml -f k8s/keycloak.yaml -f k8s/quarkus.yaml

      - name: Roll out images
        run: |
          echo "Deploying image tag $IMAGE_TAG"
          kubectl set image deployment/keycloak "keycloak=$REGISTRY_PREFIX/partyhub-keycloak:$IMAGE_TAG"
          kubectl set image deployment/quarkus "quarkus=$REGISTRY_PREFIX/partyhub-backend:$IMAGE_TAG"

      - name: Wait for rollouts
        run: |
          kubectl rollout status deployment/postgres --timeout=180s
          kubectl rollout status deployment/keycloak --timeout=600s
          kubectl rollout status deployment/quarkus --timeout=300s
          echo "Deployment successful."
